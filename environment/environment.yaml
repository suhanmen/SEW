# conda env create -f environment/environment.yaml && conda activate sew
#
# Everything used in our experiments, with the versions we used.
# Embedding and detection need only python and the tree-sitter packages; the other entries are for
# CodeContests download (huggingface_hub, pyarrow), the code-editing attacks (black, ruff, clang-tidy,
# openjdk for the Java lint attack), and code generation and the LLM attack (torch, transformers, accelerate; GPU).
name: sew
channels:
  - conda-forge
dependencies:
  - python=3.10
  - openjdk=21
  - pip
  - pip:
      - tree-sitter==0.23.2
      - tree-sitter-python==0.23.6
      - tree-sitter-java==0.23.5
      - tree-sitter-cpp==0.23.4
      - huggingface_hub==1.29.0
      - pyarrow==25.0.1
      - black==26.5.1
      - ruff==0.16.6
      - clang-tidy==22.1.8
      - torch==2.9.0
      - transformers==5.16.1
      - accelerate==1.11.0
